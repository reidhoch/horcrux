[project]
name = "horcrux"
version = "1.0.4"
description = "Horcrux - A Python implementation of Shamir's Secret Sharing."
readme = "README.md"
license = { text = "MPL-2.0" }
authors = [
    { name = "Reid Hochstedler", email = "reidhoch@gmail.com" }
]
keywords = ["cryptography", "secret-sharing", "shamir", "security", "encryption"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/reidhoch/horcrux"
Repository = "https://github.com/reidhoch/horcrux"
Documentation = "https://github.com/reidhoch/horcrux/blob/develop/README.md"
"Bug Tracker" = "https://github.com/reidhoch/horcrux/issues"
Changelog = "https://github.com/reidhoch/horcrux/releases"

[tool.poetry]
packages = [{ include = "shamir" }]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
mypy = "^1.16"
pre-commit = "^4.2"
pytest = "^8.4"
pytest-cov = "^6.2"
pytest-xdist = { extras = ["psutil"], version = "^3.7" }
ruff = "^0.14.0"
tox = "^4.26"

[tool.poetry.group.examples]
optional = true

[tool.poetry.group.examples.dependencies]
rich = "^13.0"
typer = { extras = ["all"], version = "^0.19" }

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["shamir"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 100

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
strict_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
ignore_missing_imports = true
show_column_numbers = true

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "C4",    # flake8-comprehensions
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (commented code)
    "PL",    # pylint
    "PERF",  # perflint
    "RUF",   # ruff-specific rules
]
ignore = [
    "S101",    # Allow assert in tests
    "PLR2004", # Magic value comparisons (common in crypto)
]

[tool.ruff.lint.per-file-ignores]
"shamir/math/__init__.py" = ["A005"]
"tests/**/*.py" = [
    "S311",  # Allow Random in tests (not cryptographic use)
]

[tool.ruff.lint.isort]
known-first-party = ["shamir"]
force-single-line = false

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
