[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[dependency-groups]
dev = [
  "bandit[toml]>=1.8.0",
  "complexipy>=5.1.0",
  "hypothesis>=6.142.1",
  "mutmut>=3.4.0",
  "mypy>=1.16",
  "pip-audit>=2.9.0",
  "prek>=0.3.12",
  "psutil>=7.1.0",
  "pytest>=8.4",
  "pytest-codspeed>=4.0",
  "pytest-cov>=6.2,<8.0",
  "pytest-xdist[psutil]>=3.7",
  "ruff>=0.11.13,<0.16.0",
  "scipy>=1.16.3",
  "tox>=4.26",
  "tox-uv>=1.30",
  "vulture>=2.14",
]
examples = ["typer>=0.16,<0.28"]

[project]
authors = [{ name = "Reid Hochstedler", email = "reidhoch@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
description = "A Python implementation of Shamir's Secret Sharing"
dynamic = ["version"]
keywords = ["cryptography", "secret-sharing", "shamir", "security", "vault"]
license = { text = "MPL-2.0" }
name = "horcrux"
readme = "README.md"
requires-python = ">=3.11"

[project.urls]
"Bug Tracker" = "https://github.com/reidhoch/horcrux/issues"
Changelog = "https://github.com/reidhoch/horcrux/releases"
Documentation = "https://github.com/reidhoch/horcrux#readme"
Homepage = "https://github.com/reidhoch/horcrux"
Repository = "https://github.com/reidhoch/horcrux"

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = [
  "B101",
  "B105",
] # Skip assert_used and hardcoded_password_string (false positives on error messages)

[tool.hatch.build.hooks.vcs]
version-file = "shamir/_version.py"

[tool.hatch.build.targets.wheel]
artifacts = ["shamir/py.typed"]
packages = ["shamir"]

[tool.hatch.version]
fallback-version = "0.0.0"
source = "vcs"

[tool.mutmut]
paths_to_mutate = ["shamir/"]
pytest_add_cli_args_test_selection = ["-m", "not slow and not benchmark"]

[tool.mypy]
pretty = true
python_version = "3.11"
show_column_numbers = true
show_error_codes = true
strict = true

[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = "examples.*"

[[tool.mypy.overrides]]
ignore_errors = true
module = "tests.*"

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
  "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["examples", "tests"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
ignore = ["COM812"]
select = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["shamir"]

[tool.ruff.lint.per-file-ignores]
"shamir/__init__.py" = ["C901"]  # combine() complexity is 11, acceptable for version handling
"shamir/math/__init__.py" = ["A005"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
exclude-newer = "14 days"
